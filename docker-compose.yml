services:
  db:
    image: postgres:18-alpine
    container_name: binary-group-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: binary
      POSTGRES_PASSWORD: binary_dev_password
      POSTGRES_DB: binary_group
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binary -d binary_group"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
